required-version = "==0.17.1"
target-version = "py312"
# dotfiles/hooks and dotfiles/scripts can run under the host's system python3
# (dotfiles/scripts/fleet-watch calls bare python3; dotfiles/hooks/run-hook-python
# falls back to it), which on a stock macOS is Apple's 3.9 (recalled, not
# verified on a host). py39 stops pyupgrade from rewriting them into syntax or
# APIs that need a newer Python, such as datetime.UTC (3.11+).
per-file-target-version = { "dotfiles/**" = "py39" }
extend-exclude = []
# no line-length (88 default), no select/extend-select

# Violations present when ruff was adopted (2026-10). Remove an entry by fixing it; never add one for new code.
[lint.per-file-ignores]
"dotfiles/hooks/guard_destructive.py" = ["EXE001", "SIM102"]
"evals/unit/test_claude_sh_crossplatform.py" = ["F811"]
"evals/unit/test_claude_sh_docker_state.py" = ["F811"]
"evals/unit/test_claude_sh_drain.py" = ["F811", "PLW1510"]
"evals/unit/test_claude_sh_env.py" = ["PLW1510"]
"evals/unit/test_claude_sh_keychain.py" = ["F811"]
"evals/unit/test_claude_sh_network.py" = ["F811"]
"evals/unit/test_claude_sh_overlay_staleness.py" = ["F811"]
"evals/unit/test_claude_sh_panes.py" = ["PLW1510"]
"evals/unit/test_claude_sh_pi.py" = ["F811", "PLW1510", "RUF059"]
"evals/unit/test_claude_sh_roster.py" = ["PLW1510"]
"evals/unit/test_config_loading.py" = ["PLW1510"]
"evals/unit/test_fleet_panes.py" = ["PLW1510"]
"evals/unit/test_fleet_viewed.py" = ["PLW1510"]
