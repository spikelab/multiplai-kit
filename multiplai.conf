# multiplai.conf — Kit configuration
#
# Sourced by hooks and scripts. Edit to change behavior.
# Changes take effect on next hook invocation (no restart needed).

# --- Debug mode ---
# Set to "true" for verbose hook logging to logs/hook-debug.log
# Shows: event flow, Python resolution, extraction triggers, timing
MULTIPLAI_DEBUG=false

# --- Model ceiling for hooks and SDK pipelines ---
# Sets the MAXIMUM model tier for background operations (extraction,
# memory retrieval, commit messages, catalog generation) and for the
# buildme / deep-research SDK calls that resolve through model_resolver.
#
# NOTE: this does NOT reach Claude Code skills. A skill's model and effort
# come from its own SKILL.md frontmatter and nothing else — Claude Code
# exposes no setting to override them (skillOverrides is on/off only, and
# ignores plugin skills entirely). To retune a skill, edit its frontmatter
# in the multiplai-cc-mktplace repo.
# Acts as a ceiling: hooks requesting a model above this tier get
# downgraded, models below stay as-is.
#
# Tier order: haiku < sonnet < opus
#
# Examples with MULTIPLAI_MODEL="claude-sonnet-4-6":
#   Hook wants opus  → gets sonnet (downgraded)
#   Hook wants sonnet → gets sonnet (kept)
#   Hook wants haiku  → gets haiku (kept, it's cheaper/faster)
#
# Set to "claude-opus-4-6" to allow all models (no ceiling).
MULTIPLAI_MODEL="claude-opus-4-6"

# --- Effort ceiling for SDK calls ---
# Sets the MAXIMUM effort tier for background operations and the buildme /
# deep-research SDK pipelines. Acts as a ceiling: a call requesting effort
# above this gets downgraded. Like MULTIPLAI_MODEL, it does not reach skill
# frontmatter.
#
# Tier order: low < medium < high < max
#
# Based on internal benchmarking:
#   Sonnet at medium matches Sonnet-high quality at same cost.
#   Opus benefits more from higher effort (21→25 across low→high).
MULTIPLAI_EFFORT="high"

# --- Log level for build pipeline and other components ---
# Controls verbosity of all components using setup_logging().
# DEBUG | INFO | WARNING | ERROR
# MULTIPLAI_DEBUG=true overrides this to DEBUG for backward compatibility.
MULTIPLAI_LOG_LEVEL=INFO

# --- Log retention ---
# Days to keep rotated log files. 0 = keep forever.
MULTIPLAI_LOG_RETENTION_DAYS=0

# --- Multiplai hub (optional) ---
# Where the multiplai hub (multiplai-gui) listens. Used by the launcher's
# adoption take-back flow: when the hub adopted a session you started from
# this terminal, taking it back POSTs /v1/sessions/<id>/release here before
# resuming. Leave unset if you don't run a hub — everything else works the
# same. Environment values (e.g. from .env) win over these.
# The bearer token lives in the hub's token file; prefer setting
# MULTIPLAI_HUB_TOKEN in .env (secrets don't belong in this committed file).
#
# MULTIPLAI_HUB_URL="http://127.0.0.1:8787"
# MULTIPLAI_HUB_TOKEN=""

# --- Per-TASK model tiers (pick_model — plugin skills) ---
# The buildme and deep-research plugins now resolve their model from a semantic
# tier (opus/sonnet/haiku) via multiplai_core.env.pick_model(). Each call site
# picks a default tier in code; a [task] section here OVERRIDES it at runtime
# (no code edit needed) and is still capped by the MULTIPLAI_MODEL ceiling
# above. Task keys are dotted; MODEL is a family name.
#
# Task keys the code uses today (with their in-code default tier):
#   [buildme]               MODEL=opus     # whole buildme pipeline
#   [deep-research]         MODEL=opus     # deep-research reasoning nodes
#   [deep-research.parse]   MODEL=sonnet   # deep-research per-source triage/extract
#
# Uncomment to retune, e.g. force deep-research reasoning down to sonnet:
#
# [deep-research]
# MODEL=sonnet
#
# NOTE: requires multiplai-core >= v0.7.0 installed in the plugin venvs. On
# older core these sections are simply ignored by the plugins.
