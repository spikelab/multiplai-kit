# multiplai.conf — Kit configuration
#
# Sourced by hooks and scripts. Edit to change behavior.
# Changes take effect on next hook invocation (no restart needed).

# --- Debug mode ---
# Set to "true" for verbose hook logging to logs/hook-debug.log
# Shows: event flow, Python resolution, extraction triggers, timing
MULTIPLAI_DEBUG=false

# --- Default model for pipeline steps ---
# The model for any step that no config names. A "step" is one SDK call a
# plugin pipeline makes: buildme, deep-research, review, spec-extract,
# codebase-walkthrough, pr. A step resolves its model in this order, and the
# first one set wins:
#   1. the model config assigns to that step or its stage (for example
#      `models:` in a project's specs/config.yaml, or a [task] section below)
#   2. MULTIPLAI_MODEL from the environment, then from this file
#   3. the model of the Claude Code session that started the skill
#
# Leave it unset (the shipped default) and every unconfigured step runs on
# the session's model. Nothing is capped: MULTIPLAI_MODEL is a default, not a
# limit, so a step configured for a bigger model still gets that model.
#
# Accepts a family name (haiku, sonnet, opus, fable), which means the newest
# model of that family, or a full model ID, which is used exactly as written.
#
# It does not change the model the Claude Code session itself runs on, and
# background jobs (memory retrieval, catalog generation, checkpoints, dream,
# learning extraction) keep their own defaults whatever this says.
# MULTIPLAI_MODEL=""

# --- Default effort for pipeline steps ---
# The effort for any step that no config names, resolved the same way as
# MULTIPLAI_MODEL and separately from it: config for the step or stage, then
# MULTIPLAI_EFFORT, then the session's effort. Setting MULTIPLAI_MODEL and
# leaving this unset gives that model at the session's effort.
#
# Leave it unset (the shipped default) and every unconfigured step runs at
# the session's effort. Nothing is capped.
#
# Values: low | medium | high | xhigh | max
# MULTIPLAI_EFFORT=""

# --- Log level for build pipeline and other components ---
# Controls verbosity of all components using setup_logging().
# DEBUG | INFO | WARNING | ERROR
# MULTIPLAI_DEBUG=true overrides this to DEBUG for backward compatibility.
MULTIPLAI_LOG_LEVEL=INFO

# --- Log retention ---
# Days to keep dated log files. 0 = keep forever.
# Hooks and plugin pipelines both read this line (pipelines through
# multiplai-core, which also defaults to 365 when it is missing). Every log
# is one file per UTC day; hook-errors.log moves to hook-errors-<day>.log the
# next day. Nothing is ever shortened: a dated file is deleted whole once it
# is older than this.
#
# Logs record prompt text, routing decisions and hook errors, and they live on
# the host mount — "keep forever" means every session ever run stays readable
# by anything that can read the directory. Set to 0 only if you deliberately
# want a permanent archive.
MULTIPLAI_LOG_RETENTION_DAYS=365

# --- Multiplai hub (optional) ---
# Where the multiplai hub (multiplai-gui) listens. Used by the launcher's
# adoption take-back flow: when the hub adopted a session you started from
# this terminal, taking it back POSTs /v1/sessions/<id>/release here before
# resuming. Leave unset if you don't run a hub — everything else works the
# same. Environment values (e.g. from .env) win over these.
# The bearer token lives in the hub's token file; prefer setting
# MULTIPLAI_HUB_TOKEN in .env (secrets don't belong in this committed file).
#
# MULTIPLAI_HUB_URL="http://127.0.0.1:8787"
# MULTIPLAI_HUB_TOKEN=""

# --- Design system for HTML pages (optional) ---
# The design tokens (colours, fonts, spacing) that pages built by multiplai
# skills use, read by the multiplai-dev design-system skill. The environment
# wins over these lines.
#   MULTIPLAI_DESIGN_SYSTEMS  absolute path (~ allowed) of the folder that holds
#                             one subfolder per design system (each with a
#                             tokens.css and a README.md)
#   MULTIPLAI_DESIGN_SYSTEM   the default subfolder's name
# Leave both unset and pages use the neutral theme the plugin ships. A name
# that does not exist is an error listing the names that do.
# MULTIPLAI_DESIGN_SYSTEMS=""
# MULTIPLAI_DESIGN_SYSTEM=""

# --- Per-TASK models and efforts (plugin skills) ---
# A [task] section sets the model or effort for one plugin pipeline, or one
# part of it, at runtime (no code edit needed). It wins over MULTIPLAI_MODEL /
# MULTIPLAI_EFFORT and the session's values, and nothing caps it. Task keys
# are dotted; MODEL is a family name or a full model ID, EFFORT an effort name.
#
# Task keys the code reads today:
#   [buildme]                MODEL= / EFFORT=   # whole buildme pipeline
#   [buildme.<stage>]        MODEL= / EFFORT=   # one stage, e.g. [buildme.review]
#   [deep-research]          MODEL= / EFFORT=   # deep-research reasoning nodes
#   [deep-research.parse]    MODEL=             # deep-research per-source triage/extract
#   [deep-research.<node>]   EFFORT=            # one node, e.g. [deep-research.extract]
#
# With no section, those steps use MULTIPLAI_MODEL / MULTIPLAI_EFFORT, then
# the session's model and effort.
#
# Uncomment to retune, e.g. run deep-research reasoning on sonnet:
#
# [deep-research]
# MODEL=sonnet
#
# NOTE: requires multiplai-core >= v0.7.0 installed in the plugin venvs. On
# older core these sections are simply ignored by the plugins.
